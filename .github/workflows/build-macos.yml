name: Build macOS app

# Builds "Dictate Lite.app" on real Mac runners (you can't build a Mac app from
# Windows). Produces a ready-to-run, ad-hoc-signed app bundle for both Apple
# Silicon and Intel Macs.
#
# Two ways to trigger it:
#   • Actions tab -> "Build macOS app" -> "Run workflow"  (quick test build;
#     grab the result from that run's "Artifacts").
#   • Push a tag like v1.0.0                               (also publishes a
#     GitHub Release with the zips attached — the easiest link/file to share).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to publish a Release on tag builds

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple Silicon (M-series)
            label: apple-silicon
          - runner: macos-13   # Intel
            label: intel
    defaults:
      run:
        working-directory: lite   # Dictate Lite lives here in the combined repo

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the .app bundle
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Zip the bundle (ditto preserves symlinks / exec bits)
        run: |
          cd dist
          ditto -c -k --keepParent "Dictate Lite.app" "$GITHUB_WORKSPACE/DictateLite-${{ matrix.label }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DictateLite-${{ matrix.label }}
          path: DictateLite-${{ matrix.label }}.zip
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DictateLite-${{ matrix.label }}.zip
